services:
  frontend:
    build: ./frontend
    ports:
      - "8092:80"
    depends_on:
      - api

  api:
    build: ./api
    ports:
      - "8093:5000"
    environment:
      DB_HOST: db
      DB_NAME: storedb
      DB_USER: storeuser
      DB_PASSWORD: storepass
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: storedb
      POSTGRES_USER: storeuser
      POSTGRES_PASSWORD: storepass
    volumes:
      - storedata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  storedata:
